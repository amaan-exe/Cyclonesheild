[project]
name = "cyclone-horizon"
version = "0.1.0"
description = "AI/ML System for Tropical Cyclone Identification, Classification & Prediction — SIH 2026 PS 26070"
requires-python = ">=3.10"
authors = [
    { name = "CycloneHorizon Team" }
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
